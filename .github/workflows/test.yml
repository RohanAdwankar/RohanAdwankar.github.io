name: Test

# Run only when something the tests read has changed. The tests build the
# site from posts/ with scripts/build.py and check the output, so a change to
# README.md or to assets under static/ cannot move them. robots.txt is the one
# static file they check.
#
# pull_request covers every commit on a branch with a PR open. The push
# trigger used to run on every branch too, so each PR commit ran twice.
on:
  pull_request:
    paths:
      - posts/**
      - scripts/**
      - tests/**
      - static/robots.txt
      - pyproject.toml
      - uv.lock
      - .github/workflows/test.yml
  workflow_dispatch:

# A newer commit on the same PR makes the older run moot.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # build.py reads each post's first commit for its date; the default
          # shallow checkout has no history to read it from
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Run tests
        run: uv run python -m unittest discover -s tests -v
